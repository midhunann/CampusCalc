<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator - campusCalc</title>
    <link href='https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap' rel='stylesheet'>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/nav-style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li id="logo"><a href="index.html">cC</a></li>
                <li><a href="attendance.html">maintain75+</a></li>
                <li><a href="cgpa.html">cgpaEstimator</a></li>
            </ul>
        </nav>
        <nav id="top">The College Essential</nav>
    </header>

    <main class="calculator-page">
        <section class="page-header">
            <h1 class="animate-text">CGPA Calculator</h1>
            <p class="animate-text delay-1">Calculate your CGPA easily with our grade point calculator</p>
        </section>

        <div class="calculator-container">
            <div class="grading-scale-card">
                <h3>Grading Scale Reference</h3>
                <div class="grade-table">
                    <div class="grade-row header">
                        <div>Grade</div>
                        <div>Points</div>
                    </div>
                    <div class="grade-row">
                        <div>O</div>
                        <div>10.0</div>
                    </div>
                    <div class="grade-row">
                        <div>A+</div>
                        <div>9.5</div>
                    </div>
                    <div class="grade-row">
                        <div>A</div>
                        <div>9.0</div>
                    </div>
                    <div class="grade-row">
                        <div>B+</div>
                        <div>8.0</div>
                    </div>
                    <div class="grade-row">
                        <div>B</div>
                        <div>7.0</div>
                    </div>
                    <div class="grade-row">
                        <div>C</div>
                        <div>6.0</div>
                    </div>
                    <div class="grade-row">
                        <div>P</div>
                        <div>5.0</div>
                    </div>
                    <div class="grade-row">
                        <div>F</div>
                        <div>0.0</div>
                    </div>
                </div>
            </div>

            <form id="cgpaForm" class="animated-form">
                <div class="subjects-container" id="subjectEntriesContainer">
                    <div class="subject-entry">
                        <div class="input-grid">
                            <div class="input-group">
                                <label>Subject Name</label>
                                <input type="text" name="subject[]" placeholder="Enter subject name" required>
                            </div>
                            <div class="input-group">
                                <label>Credits</label>
                                <input type="number" name="credits[]" min="1" max="5" placeholder="1-5" required>
                            </div>
                            <div class="input-group">
                                <label>Grade</label>
                                <select name="grade[]" required>
                                    <option value="" disabled selected>Select Grade</option>
                                    <option value="O">O - Outstanding</option>
                                    <option value="A+">A+ - Excellent</option>
                                    <option value="A">A - Very Good</option>
                                    <option value="B+">B+ - Good</option>
                                    <option value="B">B - Above Average</option>
                                    <option value="C">C - Average</option>
                                    <option value="P">P - Pass</option>
                                    <option value="F">F - Fail</option>
                                </select>
                            </div>
                            <div class="remove-btn-container"></div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="action-btn add-btn" onclick="addSubject()">
                        + Add Subject
                    </button>
                    <button type="button" class="action-btn calculate-btn" onclick="calculateCGPA()">
                        Calculate CGPA
                    </button>
                </div>
            </form>

            <div class="result-container">
                <div class="result-card">
                    <div class="result-header">Your CGPA Result</div>
                    <div id="cgpaOutput" class="result-content">
                        <!-- CGPA will be displayed here -->
                    </div>
                    <div id="cgpa-meter" class="cgpa-meter">
                        <div class="meter-scale"></div>
                        <div id="cgpa-pointer" class="meter-pointer"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 campusCalc. All rights reserved.</p>
    </footer>

    <script src="scripts/cgpa.js"></script>
</body>
</html>
